          ENACT_RUST_TARGET: packages/native/target
      - name: Save Rust target & cargo cache [target]
        if: ${{ (((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.cargo_targets), ',target,') && hashFiles('Cargo.lock', '**/Cargo.toml') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.runner_caches.outputs.host == '' && steps.rust_l1_cache_target_size_guard.outputs.ok == 'true') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.rust_l1_cache_target.outputs.cache-matched-key, format('{0}-rust-target-{1}-{2}-{3}-', runner.os, hashFiles('enve.lock', 'rust-toolchain.toml', 'rust-toolchain'), matrix.cargo_cache, hashFiles('Cargo.lock', '**/Cargo.toml'))))) && github.event_name != 'pull_request' && steps.rust_l1_cache_target.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.rust_l1_cache_target.outputs.cache-primary-key }}
          path: |-
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
      - name: Save Rust target & cargo cache [target] to the Host Cache
        if: ${{ (!cancelled() && env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.cargo_targets), ',target,') && hashFiles('Cargo.lock', '**/Cargo.toml') != '' && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && steps.runner_caches.outputs.host != '' && steps.prune_cargo.outcome == 'success') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |-
          [ -d "$ENACT_RUST_TARGET" ] || exit 0
          has_fp=0
          for fp in "$ENACT_RUST_TARGET"/*/.fingerprint "$ENACT_RUST_TARGET"/*/*/.fingerprint; do
            if [ -d "$fp" ]; then
              has_fp=1
              break
            fi
          done
          [ "$has_fp" = 1 ] || exit 0
          dst="$ENACT_HOST_CACHE/repo/cargo-target/$ENACT_RUST_HOST_KEY"
          tmp="$dst.new.$$"
          mkdir -p "$(dirname "$dst")"
          rm -rf "$tmp"
          cp -a --reflink=auto "$ENACT_RUST_TARGET/." "$tmp/"
          if [ -d "$dst" ]; then mv "$dst" "$dst.old.$$"; fi
          mv "$tmp" "$dst"
          rm -rf "$dst.old.$$"
          echo "Saved $ENACT_RUST_TARGET to the host cache ($(du -sh "$dst" | cut -f1))"
        env:
          ENACT_RUST_HOST_KEY: ${{ runner.os }}-rust-target-${{ hashFiles('enve.lock', 'rust-toolchain.toml', 'rust-toolchain') }}-${{ matrix.cargo_cache }}
          ENACT_RUST_TARGET: target
      - name: Save Cache [Pre-migrated Postgres SQL template]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.caches), ',pg_db_template,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1')) && github.event_name != 'pull_request' && steps.cache_pg_db_template.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_pg_db_template.outputs.cache-primary-key }}
          path: .enact/state/db-template
      - name: Save Cache [web Next.js build cache]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.caches), ',web_next_cache,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_web_next_cache.outputs.cache-matched-key, format('web_next_cache-{0}-{1}-', runner.os, hashFiles('web/next.config.mjs', 'pnpm-lock.yaml'))))) && github.event_name != 'pull_request' && steps.cache_web_next_cache.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_web_next_cache.outputs.cache-primary-key }}
          path: .enact/state/next-cache
      - name: Save Cache [web TypeScript incremental build info]
        if: ${{ ((env.ENACT_SAVE_EVENT == 'true' && contains(format(',{0},', matrix.caches), ',web_tsbuildinfo,') && (matrix.shard_index == '' || matrix.shard_index == 1 || matrix.shard_index == '1') && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch || !startsWith(steps.cache_web_tsbuildinfo.outputs.cache-matched-key, format('web_tsbuildinfo-{0}-{1}-', runner.os, hashFiles('web/tsconfig.json', 'pnpm-lock.yaml'))))) && github.event_name != 'pull_request' && steps.cache_web_tsbuildinfo.outputs.cache-hit != 'true') && !steps.skip.outputs.hit && steps.outputs-host-recover.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache_web_tsbuildinfo.outputs.cache-primary-key }}
          path: web/.tsbuildinfo
    - name: Save Built Outputs to the Host Cache
      if: ${{ success() && steps.runner_caches.outputs.host != '' && !steps.skip.outputs.hit && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs save
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Copy Host-Cached Outputs for GitHub's Cache
      id: outputs-publish
      if: ${{ success() && steps.outputs-host-lookup.outputs.cache-hit == 'true' && (steps.outputs-lookup.outputs.cache-hit != 'true' || (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) && steps.outputs-remote-lookup.outputs.cache-hit != 'true') && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs restore-build
      env:
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
    - name: Cache Built Outputs
      id: cache_outputs
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}-${{ matrix.output_key }}
        path: ${{ matrix.output_paths }}
    - name: Verify Built Outputs Cached
      id: outputs_cached
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && steps.cache_outputs.outcome == 'success' && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        key: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}-${{ matrix.output_key }}
        lookup-only: "true"
        path: ${{ matrix.output_paths }}
    - name: Upload Built Outputs Artifact
      if: ${{ success() && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && (steps.cache_outputs.outcome != 'success' || steps.outputs_cached.outputs.cache-hit != 'true') && matrix.output_key != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        if-no-files-found: error
        include-hidden-files: "true"
        name: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}
        path: ${{ matrix.output_paths }}
        retention-days: "1"
    - name: Save Built Outputs to the Remote Cache
      if: ${{ success() && (github.event_name == 'schedule' || github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch) && steps.outputs-remote-lookup.outputs.cache-hit != 'true' && (!steps.skip.outputs.hit || steps.outputs-publish.outputs.cache-hit == 'true') && matrix.output_key != '' }}
      continue-on-error: true
      run: enact ci host-outputs remote-save
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || env.R2_ACCESS_KEY_ID }}
        AWS_REGION: auto
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || env.R2_SECRET_ACCESS_KEY }}
        ENACT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ENACT_OUTPUTS_KEY: enact-outputs-${{ matrix.output_slug }}-${{ runner.os }}${{ !matrix.output_arch_independent && format('-{0}', runner.arch) || '' }}-${{ matrix.output_key }}
        ENACT_OUTPUTS_PATHS: ${{ matrix.output_paths }}
        ENACT_R2_BUCKET: ${{ secrets.R2_BUCKET || env.R2_BUCKET }}
